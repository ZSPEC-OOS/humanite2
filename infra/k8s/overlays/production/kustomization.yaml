apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: humanite-production

resources:
  - ../../base

commonLabels:
  environment: production

patches:
  - target:
      kind: Deployment
      name: orchestration
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
