version: "3.9"

x-common-env: &common-env
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONASYNCIODEBUG: "1"
  DATABASE_URL: "postgresql+asyncpg://dev:dev@postgres:5432/humanite_dev"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "devroot"
  MINIO_SECRET_KEY: "devpassword"
  ENVIRONMENT: "development"
  LOG_LEVEL: "DEBUG"

services:
  postgres:
    image: postgres:15.4-alpine
    environment:
      POSTGRES_DB: humanite_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 512mb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: devroot
      MINIO_ROOT_PASSWORD: devpassword
    command: server /data --console-address ":9001"
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  ollama:
    image: ollama/ollama:0.3.6
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]

  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    ports: ["16686:16686", "4318:4318"]

  gateway:
    build:
      context: ./services/gateway
      target: development
    ports: ["8080:8080"]
    volumes: [./services/gateway:/app]
    environment:
      UPSTREAM_ORCHESTRATION: "http://orchestration:8000"
      UPSTREAM_USER_MGMT: "http://user-management:8004"
      REDIS_URL: "redis://redis:6379/2"
      JWT_PUBLIC_KEY_PATH: "/keys/jwt.pub"
      ENVIRONMENT: "development"
    depends_on:
      redis: {condition: service_healthy}

  orchestration:
    build:
      context: ./services/orchestration
      target: development
    ports: ["8000:8000"]
    volumes: [./services/orchestration:/app]
    environment:
      <<: *common-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  preprocessing:
    build:
      context: ./services/preprocessing
      target: development
    ports: ["8001:8001"]
    volumes: [./services/preprocessing:/app]
    environment:
      <<: *common-env
    depends_on:
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload

  humanization:
    build:
      context: ./services/humanization
      target: development
    ports: ["8002:8002"]
    volumes: [./services/humanization:/app]
    environment:
      <<: *common-env
      OLLAMA_BASE_URL: "http://ollama:11434"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      WATERMARK_SECRET_SALT: "${WATERMARK_SECRET_SALT}"
      MODEL_ROUTING_RULES: '{"humanize_light":"ollama/mistral:7b","humanize_heavy":"ollama/mistral:7b"}'
    depends_on:
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload

  scanner:
    build:
      context: ./services/scanner
      target: development
    ports: ["8003:8003"]
    volumes:
      - ./services/scanner:/app
      - ./ml/models:/app/models:ro
    environment:
      <<: *common-env
    depends_on:
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8003 --reload

  user-management:
    build:
      context: ./services/user-management
      target: development
    ports: ["8004:8004"]
    volumes: [./services/user-management:/app]
    environment:
      <<: *common-env
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8004 --reload

  worker-humanize:
    build:
      context: ./workers/humanize-interactive
      target: development
    volumes: [./workers/humanize-interactive:/app]
    environment:
      <<: *common-env
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      WATERMARK_SECRET_SALT: "${WATERMARK_SECRET_SALT}"
    command: celery -A src.celery_app worker -Q humanize.interactive -c 4 --loglevel=info
    depends_on:
      redis: {condition: service_healthy}

  worker-scan:
    build:
      context: ./workers/scan-interactive
      target: development
    volumes: [./workers/scan-interactive:/app]
    environment:
      <<: *common-env
    command: celery -A src.celery_app worker -Q scan.interactive -c 4 --loglevel=info
    depends_on:
      redis: {condition: service_healthy}

  web:
    build:
      context: ./apps/web
      target: development
    ports: ["3000:3000"]
    volumes: [./apps/web:/app, /app/node_modules, /app/.next]
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8080"
    command: pnpm dev

volumes:
  postgres_data:
  minio_data:
  ollama_models:

networks:
  default:
    name: humanite_dev
