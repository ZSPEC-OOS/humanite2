version: "3.9"

x-test-env: &test-env
  PYTHONDONTWRITEBYTECODE: "1"
  DATABASE_URL: "postgresql+asyncpg://test:test@postgres:5432/humanite_test"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  ENVIRONMENT: "test"
  LOG_LEVEL: "WARNING"
  WATERMARK_SECRET_SALT: "test-salt-32-bytes-placeholder-xx"
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
  OPENAI_API_KEY: "sk-test-key"

services:
  postgres:
    image: postgres:15.4-alpine
    environment:
      POSTGRES_DB: humanite_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    volumes:
      - ./infra/sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  orchestration:
    build:
      context: ./services/orchestration
      target: development
    ports: ["8000:8000"]
    environment:
      <<: *test-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 5s
      retries: 10

  preprocessing:
    build:
      context: ./services/preprocessing
      target: development
    ports: ["8001:8001"]
    environment:
      <<: *test-env
    depends_on:
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]
      interval: 5s
      retries: 10

  humanization:
    build:
      context: ./services/humanization
      target: development
    ports: ["8002:8002"]
    environment:
      <<: *test-env
      OLLAMA_BASE_URL: ""
    depends_on:
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/v1/health"]
      interval: 5s
      retries: 10

  scanner:
    build:
      context: ./services/scanner
      target: development
    ports: ["8003:8003"]
    environment:
      <<: *test-env
    depends_on:
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/v1/health"]
      interval: 5s
      retries: 10

  user-management:
    build:
      context: ./services/user-management
      target: development
    ports: ["8004:8004"]
    environment:
      <<: *test-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: uvicorn src.main:app --host 0.0.0.0 --port 8004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/v1/health"]
      interval: 5s
      retries: 10

  gateway:
    build:
      context: ./services/gateway
      target: development
    ports: ["8080:8080"]
    environment:
      UPSTREAM_ORCHESTRATION: "http://orchestration:8000"
      UPSTREAM_USER_MGMT: "http://user-management:8004"
      REDIS_URL: "redis://redis:6379/2"
      ENVIRONMENT: "test"
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 5s
      retries: 10

networks:
  default:
    name: humanite_test
